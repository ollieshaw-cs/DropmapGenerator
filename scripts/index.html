<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Image Coordinate Viewer</title>
<style>
  :root {
    --bg: #f5f5f7;
    --panel: #ffffff;
    --text: #1a1a1a;
    --muted: #666666;
    --border: #d8d8dc;
    --accent: #3b6fd4;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16171a;
      --panel: #212226;
      --text: #eaeaec;
      --muted: #9a9aa0;
      --border: #3a3b40;
      --accent: #6f9bff;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16171a;
    --panel: #212226;
    --text: #eaeaec;
    --muted: #9a9aa0;
    --border: #3a3b40;
    --accent: #6f9bff;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
    min-height: 100%;
  }
  h1 { font-size: 1.2rem; margin: 0 0 16px; }
  .upload-row {
    margin-bottom: 16px;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  input[type="file"] {
    color: var(--text);
  }
  .stage {
    width: min(500px, 90vw);
    height: min(500px, 90vw);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .stage img {
    max-width: 100%;
    max-height: 100%;
    display: block;
    cursor: grab;
    transform-origin: 0 0;
    user-select: none;
    -webkit-user-drag: none;
  }
  .placeholder {
    color: var(--muted);
    font-size: 0.9rem;
    padding: 20px;
    text-align: center;
  }
  .readout {
    margin-top: 14px;
    font-variant-numeric: tabular-nums;
    font-size: 0.95rem;
    color: var(--muted);
    min-height: 1.4em;
  }
  .readout strong {
    color: var(--text);
  }
  .toast {
    margin-top: 8px;
    font-size: 0.85rem;
    color: var(--accent);
    opacity: 0;
    transition: opacity 0.2s ease;
    min-height: 1.2em;
  }
  .toast.show {
    opacity: 1;
  }
</style>
</head>
<body>
  <h1>Image Coordinate Viewer</h1>
  <div class="upload-row">
    <input type="file" id="fileInput" accept="image/png">
  </div>
  <div class="stage" id="stage">
    <div class="placeholder" id="placeholder">Upload a PNG to begin</div>
  </div>
  <div class="readout" id="readout">&nbsp;</div>
  <div class="toast" id="toast"></div>

<script>
  const fileInput = document.getElementById('fileInput');
  const stage = document.getElementById('stage');
  const placeholder = document.getElementById('placeholder');
  const readout = document.getElementById('readout');
  const toast = document.getElementById('toast');
  let img = null;
  let scale = 1, tx = 0, ty = 0;
  let lastX = null, lastY = null;
  const MIN_SCALE = 1;
  const MAX_SCALE = 40;

  let dragging = false;
  let dragStartX = 0, dragStartY = 0, startTx = 0, startTy = 0;

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);

    if (img) img.remove();
    img = new Image();
    img.draggable = false;
    scale = 1; tx = 0; ty = 0;
    img.onload = () => {
      placeholder.style.display = 'none';
      clampPan();
      applyTransform();
      readout.innerHTML = `Natural size: <strong>${img.naturalWidth} × ${img.naturalHeight}</strong>px — hover, scroll to zoom, drag to pan`;
    };
    img.src = url;
    img.addEventListener('mousemove', onMove);
    img.addEventListener('mouseleave', () => {
      if (!dragging) {
        lastX = null;
        lastY = null;
        readout.innerHTML = `Natural size: <strong>${img.naturalWidth} × ${img.naturalHeight}</strong>px — hover, scroll to zoom, drag to pan`;
      }
    });
    img.addEventListener('wheel', onWheel, { passive: false });
    img.addEventListener('mousedown', onDragStart);
    stage.appendChild(img);
  });

  function applyTransform() {
    img.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  }

  function clampPan() {
    const stageW = stage.clientWidth, stageH = stage.clientHeight;
    const baseW = img.offsetWidth, baseH = img.offsetHeight;
    const baseLeft = img.offsetLeft, baseTop = img.offsetTop;
    const renderedW = baseW * scale, renderedH = baseH * scale;

    if (renderedW >= stageW) {
      const txMin = stageW - renderedW - baseLeft;
      const txMax = -baseLeft;
      tx = Math.min(txMax, Math.max(txMin, tx));
    } else {
      tx = (stageW - renderedW) / 2 - baseLeft;
    }

    if (renderedH >= stageH) {
      const tyMin = stageH - renderedH - baseTop;
      const tyMax = -baseTop;
      ty = Math.min(tyMax, Math.max(tyMin, ty));
    } else {
      ty = (stageH - renderedH) / 2 - baseTop;
    }
  }

  function onMove(e) {
    const rect = img.getBoundingClientRect();
    const relX = (e.clientX - rect.left) / rect.width;
    const relY = (e.clientY - rect.top) / rect.height;
    const x = Math.floor(relX * img.naturalWidth);
    const y = Math.floor(relY * img.naturalHeight);
    lastX = x;
    lastY = y;
    readout.innerHTML = `x: <strong>${x}</strong>&nbsp;&nbsp; y: <strong>${y}</strong> &nbsp;<span style="opacity:.6">(of ${img.naturalWidth}×${img.naturalHeight})</span>`;
  }

  function onWheel(e) {
    e.preventDefault();
    const rect = img.getBoundingClientRect();
    const px = (e.clientX - rect.left) / scale;
    const py = (e.clientY - rect.top) / scale;

    const zoomFactor = Math.exp(-e.deltaY * 0.0015);
    const newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale * zoomFactor));

    tx += (scale - newScale) * px;
    ty += (scale - newScale) * py;
    scale = newScale;
    clampPan();
    applyTransform();
    onMove(e);
  }

  function onDragStart(e) {
    if (e.button !== 0) return;
    e.preventDefault();
    dragging = true;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    startTx = tx;
    startTy = ty;
    img.style.cursor = 'grabbing';
    document.addEventListener('mousemove', onDragMove);
    document.addEventListener('mouseup', onDragEnd);
  }

  function onDragMove(e) {
    tx = startTx + (e.clientX - dragStartX);
    ty = startTy + (e.clientY - dragStartY);
    clampPan();
    applyTransform();
    onMove(e);
  }

  function onDragEnd() {
    dragging = false;
    if (img) img.style.cursor = 'grab';
    document.removeEventListener('mousemove', onDragMove);
    document.removeEventListener('mouseup', onDragEnd);
  }

  document.addEventListener('keydown', (e) => {
    if (!(e.ctrlKey || e.metaKey) || e.key.toLowerCase() !== 'c') return;
    if (lastX === null || lastY === null) return;
    e.preventDefault();
    const text = `(${lastX}, ${lastY})`;
    navigator.clipboard.writeText(text).then(() => {
      toast.textContent = `Copied ${text}`;
      toast.classList.add('show');
      clearTimeout(toast._hideTimer);
      toast._hideTimer = setTimeout(() => toast.classList.remove('show'), 1200);
    }).catch(() => {});
  });
</script>
</body>
</html>
